<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alcovia Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #06090f;
            --surface: #0d1117;
            --surface-2: #161b22;
            --border: #21262d;
            --border-focus: #388bfd;
            --text: #f0f6fc;
            --text-muted: #7d8590;
            --accent: #2f81f7;
            --green: #3fb950;
            --green-dim: rgba(63, 185, 80, 0.1);
            --amber: #d29922;
            --amber-dim: rgba(210, 153, 34, 0.1);
            --red: #f85149;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 0;
            min-height: 100%;
            -webkit-font-smoothing: antialiased;
        }

        .screen {
            width: 100%;
            max-width: 420px;
            padding: 2rem 1.5rem;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .screen.active { display: flex; }

        .brand {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .brand::before, .brand::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 1px;
            background: var(--border);
            vertical-align: middle;
            margin: 0 12px;
        }

        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2.8rem, 12vw, 4rem);
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1.1;
            white-space: nowrap;
        }

        .time-display .period {
            font-size: 0.4em;
            font-weight: 500;
            color: var(--text-muted);
            vertical-align: super;
            margin-left: 4px;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0.5rem 0 2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            background: transparent;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .tab-panel { display: none; width: 100%; }
        .tab-panel.active { display: flex; flex-direction: column; align-items: center; }

        /* Form elements */
        .form-group { width: 100%; margin-bottom: 1rem; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            width: 100%;
            margin-bottom: 1rem;
        }

        .form-row .form-group { margin-bottom: 0; }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 5px solid var(--text-muted);
            pointer-events: none;
        }

        select {
            width: 100%;
            padding: 14px 40px 14px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
        }

        select option { background: var(--surface); color: var(--text); }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.2s;
        }

        input[type="date"] {
            color-scheme: dark;
            font-size: 0.9rem;
        }

        input[type="text"]::placeholder { color: var(--text-muted); opacity: 0.6; }

        input[type="text"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
        }

        .field-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .required-star { color: var(--red); margin-left: 2px; }

        /* Notices */
        .notice {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .notice.late {
            background: var(--amber-dim);
            border: 1px solid rgba(210, 153, 34, 0.3);
            color: var(--amber);
        }

        .notice.leave {
            background: rgba(248, 81, 73, 0.08);
            border: 1px solid rgba(248, 81, 73, 0.2);
            color: #ff7b72;
        }

        /* Days info display */
        .days-info {
            padding: 13px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            width: 100%;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 15px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

        .btn-checkin { background: var(--green); color: #fff; }
        .btn-checkin:hover:not(:disabled) {
            background: #2ea043;
            box-shadow: 0 4px 20px rgba(63, 185, 80, 0.25);
        }

        .btn-leave { background: var(--accent); color: #fff; }
        .btn-leave:hover:not(:disabled) {
            background: #1a6fe8;
            box-shadow: 0 4px 20px rgba(47, 129, 247, 0.25);
        }

        /* Status card */
        .status-card {
            width: 100%;
            margin-top: 1.25rem;
            padding: 16px 20px;
            border-radius: 10px;
            display: none;
        }

        .status-card.visible { display: block; }

        .status-card.checked-in {
            background: var(--green-dim);
            border: 1px solid rgba(63, 185, 80, 0.2);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .status-row + .status-row {
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .status-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

        .status-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-time.green { color: var(--green); }
        .status-time.amber { color: var(--amber); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .status-badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-badge.in { color: var(--green); }
        .status-badge.in .dot { background: var(--green); }
        .status-badge.out { color: var(--amber); }
        .status-badge.out .dot { background: var(--amber); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .duration {
            text-align: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .duration strong {
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--green); color: #fff; }
        .toast.error { background: var(--red); color: #fff; }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            body { padding: 1rem 0; }
            .screen { padding: 1.5rem 1.25rem; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="blocked" class="screen">
        <div class="brand">Alcovia</div>
        <div style="text-align:center; margin-top:3rem;">
            <div style="font-size:2.5rem; margin-bottom:1rem;">&#128274;</div>
            <h1 style="font-size:1.2rem; font-weight:600; margin-bottom:0.5rem; color:var(--red);">Access Restricted</h1>
            <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.5;">Connect to the office Wi-Fi<br>to mark attendance.</p>
        </div>
    </div>

    <div id="app" class="screen">
        <div class="brand">Alcovia</div>
        <div class="time-display" id="clock"></div>
        <div class="date-display" id="date"></div>

        <div class="tabs">
            <button class="tab active" data-tab="attendance">Attendance</button>
            <button class="tab" data-tab="leave">Leave Request</button>
        </div>

        <!-- Attendance Tab -->
        <div id="tab-attendance" class="tab-panel active">
            <div class="form-group">
                <label class="field-label">Employee</label>
                <div class="select-wrapper">
                    <select id="employee">
                        <option value="" disabled selected>Select your name</option>
                        <option value="vibhor" data-email="vibhor.gautam@alcovia.life" data-full="Vibhor Gautam">Vibhor Gautam</option>
                        <option value="sahil" data-email="sahil@alcovia.life" data-full="Sahil Puri">Sahil Puri</option>
                        <option value="gaurav" data-email="gaurav.mehta@alcovia.life" data-full="Gaurav Mehta">Gaurav Mehta</option>
                        <option value="samanyu" data-email="samanyu.pant@alcovia.life" data-full="Samanyu Pant">Samanyu Pant</option>
                        <option value="nikita" data-email="nikita.jangra@alcovia.life" data-full="Nikita Jangra">Nikita Jangra</option>
                    </select>
                </div>
            </div>

            <div id="leave-group" class="form-group hidden">
                <label class="field-label">Yesterday's Absence<span class="required-star">*</span></label>
                <div class="notice leave">No check-in recorded for yesterday. Fill in both fields to continue.</div>
                <select id="leave-type-yesterday">
                    <option value="" disabled selected>Select type</option>
                    <option value="Sick">Sick</option>
                    <option value="Vacation">Vacation</option>
                    <option value="Personal">Personal</option>
                    <option value="Emergency">Emergency</option>
                </select>
                <input type="text" id="leave-reason" placeholder="Brief reason (e.g. Fever, Family function)" style="margin-top:8px">
            </div>

            <div id="reason-group" class="form-group hidden">
                <label class="field-label">Reason for late arrival<span class="required-star">*</span></label>
                <div class="notice late">You are arriving after 9:35 AM. A reason is required.</div>
                <input type="text" id="reason" placeholder="e.g. Traffic, Doctor visit, Overslept">
            </div>

            <div id="notice-offpremise" class="notice leave hidden">Connect to office Wi-Fi to mark attendance.</div>
            <button class="btn btn-checkin" id="btn-checkin" disabled>Check In</button>

            <div id="status-card" class="status-card"></div>

        </div>

        <!-- Leave Request Tab -->
        <div id="tab-leave" class="tab-panel">
            <div class="form-group">
                <label class="field-label">Employee</label>
                <div class="select-wrapper">
                    <select id="leave-employee">
                        <option value="" disabled selected>Select your name</option>
                        <option value="vibhor" data-email="vibhor.gautam@alcovia.life" data-full="Vibhor Gautam">Vibhor Gautam</option>
                        <option value="sahil" data-email="sahil@alcovia.life" data-full="Sahil Puri">Sahil Puri</option>
                        <option value="gaurav" data-email="gaurav.mehta@alcovia.life" data-full="Gaurav Mehta">Gaurav Mehta</option>
                        <option value="samanyu" data-email="samanyu.pant@alcovia.life" data-full="Samanyu Pant">Samanyu Pant</option>
                        <option value="nikita" data-email="nikita.jangra@alcovia.life" data-full="Nikita Jangra">Nikita Jangra</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="field-label">Leave Type</label>
                <div class="select-wrapper">
                    <select id="leave-type">
                        <option value="Sick">Sick</option>
                        <option value="Vacation">Vacation</option>
                        <option value="Personal">Personal</option>
                        <option value="Emergency">Emergency</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Start Date</label>
                    <input type="date" id="leave-start">
                </div>
                <div class="form-group">
                    <label class="field-label">End Date</label>
                    <input type="date" id="leave-end">
                </div>
            </div>

            <div class="form-group">
                <label class="field-label">Duration</label>
                <div class="days-info" id="leave-days">Select dates above</div>
            </div>

            <div class="form-group">
                <label class="field-label">Reason<span class="required-star">*</span></label>
                <input type="text" id="leave-reason-text" placeholder="e.g. Fever, Family event, Personal work">
            </div>

            <button class="btn btn-leave" id="btn-submit-leave">Submit Leave Request</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const ALLOWED_IPS = ['14.143.254.194'];
        let isOnPremise = false;
        // v2: the old key could hold check-ins that were cached even though the save failed
        const STORAGE_KEY = 'alcovia_attendance_v2';
        const LATE_HOUR = 9;
        const LATE_MINUTE = 35;

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwj9HvnKZOCKEmu5CODKcdyHVRF-j-rB52UZytumdyvlRv4WR8e0qCvnqy3ebV5Gv6s1w/exec';
        // check-ins and the yesterday lookup go through n8n (Sahil's service account), leave requests stay on Apps Script
        const ATTENDANCE_API = 'https://n8n.alcovia.life/webhook/alcovia-attendance-api';
        // bump on every deploy so tabs left open pick up the new page on their own
        const PAGE_VERSION = '2026-10-05.2';

        // ── Utilities ────────────────────────────────────────────────

        function localDateKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function todayKey() { return localDateKey(new Date()); }

        function getPreviousWorkday() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            while (d.getDay() === 0) d.setDate(d.getDate() - 1);
            return localDateKey(d);
        }

        function getRecords() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
            catch { return {}; }
        }

        function saveRecord(entry, dateKey) {
            const key = dateKey || todayKey();
            const records = getRecords();
            if (!records[key]) records[key] = [];
            records[key].push(entry);
            // local copy is only for the UI, the server already has the row
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch {}
        }

        // keyed by email and the previous workday, so a page left open overnight looks up the right day
        const yesterdayCache = {}; // yKey -> boolean (has entry on prev workday)
        const lookupPending = {}; // yKey -> true while the yesterday lookup is in flight

        function yKey(email) { return email + '|' + getPreviousWorkday(); }

        async function prefetchYesterday(emp) {
            const prevDay = getPreviousWorkday();
            const email = emp.email;
            const key = email + '|' + prevDay;
            if (key in yesterdayCache) return;
            yesterdayCache[key] = true; // default: hide absence form while fetching
            lookupPending[key] = true;
            try {
                const payload = JSON.stringify({ action: 'checkYesterday', email, date: prevDay });
                const params = new URLSearchParams({ payload });
                const res = await fetch(`${ATTENDANCE_API}?${params.toString()}`);
                const data = await res.json();
                // only trust an explicit answer, anything else fails open
                yesterdayCache[key] = typeof data.hasEntry === 'boolean' ? data.hasEntry : true;
            } catch {
                yesterdayCache[key] = true; // fail open, don't block check-in
            }
            delete lookupPending[key];
            updateUI();
        }

        function hadYesterdayEntry(empEmail) {
            const key = yKey(empEmail);
            return key in yesterdayCache ? yesterdayCache[key] : true;
        }

        function getEntries(empId) {
            return (getRecords()[todayKey()] || []).filter(e => e.employeeId === empId);
        }

        function getLastEntry(empId) {
            const entries = getEntries(empId);
            return entries.length ? entries[entries.length - 1] : null;
        }

        function isCurrentlyLate() {
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes();
            return h > LATE_HOUR || (h === LATE_HOUR && m > LATE_MINUTE);
        }

        function formatClock(date) {
            const h = date.getHours();
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            const period = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return { time: `${String(h12).padStart(2, '0')}:${m}:${s}`, period };
        }

        function formatShortTime(iso) {
            const d = new Date(iso);
            const h = d.getHours();
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            const p = h >= 12 ? 'PM' : 'AM';
            return `${String(h % 12 || 12).padStart(2, '0')}:${m}:${s} ${p}`;
        }

        function formatHHMM(date) {
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function formatDuration(ms) {
            const totalMin = Math.floor(ms / 60000);
            const h = Math.floor(totalMin / 60), m = totalMin % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        function getDayName(date) {
            return date.toLocaleDateString('en-IN', { weekday: 'long' });
        }

        function getStatus(date) {
            const h = date.getHours(), m = date.getMinutes();
            return (h > LATE_HOUR || (h === LATE_HOUR && m > LATE_MINUTE)) ? 'Late' : 'On Time';
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // resolves to the server reply only when it confirms the row is saved, otherwise null
        async function pushToSheet(data) {
            const params = new URLSearchParams({ payload: JSON.stringify({ action: 'checkin', ...data }) });
            try {
                const res = await fetch(`${ATTENDANCE_API}?${params.toString()}`);
                if (!res.ok) return null;
                const body = await res.json();
                return body.result === 'ok' ? body : null;
            } catch (err) {
                console.error('Sheet sync failed:', err);
                return null;
            }
        }

        // ── Clock ────────────────────────────────────────────────────

        function updateClock() {
            const now = new Date();
            const { time, period } = formatClock(now);
            document.getElementById('clock').innerHTML = `${time}<span class="period">${period}</span>`;
            document.getElementById('date').textContent = now.toLocaleDateString('en-IN', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }

        // ── Attendance tab ───────────────────────────────────────────

        function getSelectedEmployee() {
            const sel = document.getElementById('employee');
            const opt = sel.options[sel.selectedIndex];
            if (!sel.value) return null;
            return { id: sel.value, name: opt.dataset.full, email: opt.dataset.email };
        }

        function updateUI() {
            const emp = getSelectedEmployee();
            const checkinBtn = document.getElementById('btn-checkin');
            const card = document.getElementById('status-card');
            const leaveGroup = document.getElementById('leave-group');
            const reasonGroup = document.getElementById('reason-group');

            const offPremiseNotice = document.getElementById('notice-offpremise');
            offPremiseNotice.classList.toggle('hidden', isOnPremise);

            if (!emp) {
                checkinBtn.disabled = true;
                checkinBtn.classList.remove('hidden');
                card.classList.remove('visible');
                leaveGroup.classList.add('hidden');
                reasonGroup.classList.add('hidden');
                return;
            }

            const last = getLastEntry(emp.id);
            const isPreCheckin = !last;

            // the previous workday changes at midnight, so look it up again for the new day
            if (isPreCheckin && !(yKey(emp.email) in yesterdayCache)) prefetchYesterday(emp);

            leaveGroup.classList.toggle('hidden', !isPreCheckin || hadYesterdayEntry(emp.email));
            reasonGroup.classList.toggle('hidden', !isPreCheckin || !isCurrentlyLate());

            if (!last) {
                // wait for the yesterday lookup so the absence form can't be skipped by checking in early
                checkinBtn.disabled = !isOnPremise || saving || !!lookupPending[yKey(emp.email)];
                checkinBtn.classList.remove('hidden');
                card.classList.remove('visible');
            } else {
                checkinBtn.classList.add('hidden');
                card.className = 'status-card visible checked-in';
                card.innerHTML = `
                    <div class="status-badge in"><span class="dot"></span> Checked In</div>
                    <div class="status-row">
                        <span class="status-label">Checked in at</span>
                        <span class="status-time green">${formatShortTime(last.timestamp)}</span>
                    </div>`;
            }
        }

        let saving = false;

        async function record(type) {
            const emp = getSelectedEmployee();
            if (!emp || saving) return;

            // one timestamp for the whole tap, so the network check can't push it past the late cutoff or midnight
            const tapTime = new Date();
            let absence = null;
            if (type === 'in') {
                const prevDay = getPreviousWorkday();
                if (!hadYesterdayEntry(emp.email)) {
                    const leaveType = document.getElementById('leave-type-yesterday').value;
                    const leaveReason = document.getElementById('leave-reason').value.trim();
                    if (!leaveType) { showToast("Select absence type", 'error'); return; }
                    if (!leaveReason) { showToast("Provide a reason for yesterday's absence", 'error'); return; }
                    absence = { prevDay, leaveType, leaveReason };
                }

                if (getStatus(tapTime) === 'Late') {
                    const reason = document.getElementById('reason').value.trim();
                    if (!reason) { showToast('Provide a reason for late arrival', 'error'); return; }
                }
            }

            const btn = document.getElementById('btn-checkin');
            saving = true;
            btn.disabled = true;
            btn.textContent = 'Saving...';

            // the page may have been opened on office wifi and then moved to mobile data, so check again now
            const ip = await getPublicIp();
            isOnPremise = ALLOWED_IPS.includes(ip);
            if (!isOnPremise) {
                btn.textContent = 'Check In';
                saving = false;
                updateUI();
                showToast('Not on the WeWork network. Connect to office wifi to check in.', 'error');
                return;
            }

            const now = tapTime;
            const reason = document.getElementById('reason').value.trim();

            const saved = await pushToSheet({
                ip,
                date: localDateKey(now),
                day: getDayName(now),
                name: emp.name,
                email: emp.email,
                time: formatHHMM(now),
                status: getStatus(now),
                reason: reason
            });

            btn.textContent = 'Check In';

            if (!saved) {
                saving = false;
                updateUI();
                showToast('Check-in NOT saved. Please try again.', 'error');
                return;
            }

            // yesterday's absence is filed only once today's check-in is confirmed, and not at all when
            // the server says today was already saved (another tab or device got there first)
            let absenceFailed = false;
            if (absence && !saved.duplicate) {
                const absenceParams = new URLSearchParams({ payload: JSON.stringify({
                    action: 'leave', name: emp.name, email: emp.email,
                    leaveType: absence.leaveType, startDate: absence.prevDay, endDate: absence.prevDay, reason: absence.leaveReason
                })});
                try {
                    const r = await fetch(`${SCRIPT_URL}?${absenceParams.toString()}`);
                    const d = await r.json();
                    absenceFailed = d.result !== 'ok';
                } catch {
                    absenceFailed = true;
                }
                if (!absenceFailed) {
                    saveRecord({ employeeId: emp.id, type: 'leave', timestamp: new Date(absence.prevDay).toISOString() }, absence.prevDay);
                }
            }

            // on a duplicate, show the time the server already has rather than this retry's time
            let checkedAt = now;
            if (saved.duplicate && /^\d{1,2}:\d{2}$/.test(saved.time || '')) {
                const [hh, mi] = saved.time.split(':').map(Number);
                checkedAt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mi);
            }
            saveRecord({ employeeId: emp.id, type: type, timestamp: checkedAt.toISOString() });
            // a duplicate only proves today's check-in exists, not that yesterday's absence was filed
            const absenceUnconfirmed = absence && saved.duplicate;
            document.getElementById('reason').value = '';
            if (!absenceFailed && !absenceUnconfirmed) document.getElementById('leave-reason').value = '';
            saving = false;
            updateUI();
            if (absenceFailed) {
                showToast("Checked in, but yesterday's absence was NOT filed. Use the Leave Request tab.", 'error');
            } else if (absenceUnconfirmed) {
                showToast("Already checked in today. If yesterday's absence isn't filed, use the Leave Request tab.", 'error');
            } else {
                showToast(saved.duplicate ? 'Already checked in today' : 'Checked in successfully', 'success');
            }
        }

        // ── Leave Request tab ────────────────────────────────────────

        function getSelectedLeaveEmployee() {
            const sel = document.getElementById('leave-employee');
            const opt = sel.options[sel.selectedIndex];
            if (!sel.value) return null;
            return { id: sel.value, name: opt.dataset.full, email: opt.dataset.email };
        }

        function updateLeaveDays() {
            const start = document.getElementById('leave-start').value;
            const end = document.getElementById('leave-end').value;
            const el = document.getElementById('leave-days');
            if (!start || !end) { el.textContent = 'Select dates above'; return; }
            const s = new Date(start), e = new Date(end);
            if (e < s) { el.textContent = 'End date before start date'; return; }
            const days = Math.round((e - s) / 86400000) + 1;
            el.textContent = days + (days === 1 ? ' day' : ' days');
        }

        function submitLeave() {
            const emp = getSelectedLeaveEmployee();
            if (!emp) { showToast('Select an employee', 'error'); return; }

            const leaveType = document.getElementById('leave-type').value;
            const startDate = document.getElementById('leave-start').value;
            const endDate = document.getElementById('leave-end').value;
            const reason = document.getElementById('leave-reason-text').value.trim();

            if (!startDate || !endDate) { showToast('Select start and end dates', 'error'); return; }
            if (new Date(endDate) < new Date(startDate)) { showToast('End date cannot be before start date', 'error'); return; }
            if (!reason) { showToast('Reason is required', 'error'); return; }

            const btn = document.getElementById('btn-submit-leave');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const params = new URLSearchParams({ payload: JSON.stringify({ action: 'leave', name: emp.name, email: emp.email, leaveType, startDate, endDate, reason }) });

            fetch(`${SCRIPT_URL}?${params.toString()}`)
                .then(r => r.json())
                .then(data => {
                    if (data.result === 'ok') {
                        showToast('Leave request submitted', 'success');
                        document.getElementById('leave-reason-text').value = '';
                        setLeaveDefaults();
                    } else {
                        showToast('Submission failed. Try again.', 'error');
                    }
                })
                .catch(() => showToast('Network error. Try again.', 'error'))
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = 'Submit Leave Request';
                });
        }

        function setLeaveDefaults() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const iso = localDateKey(tomorrow);
            document.getElementById('leave-start').value = iso;
            document.getElementById('leave-end').value = iso;
            updateLeaveDays();
        }

        // ── Tabs ─────────────────────────────────────────────────────

        function initTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                });
            });
        }

        // ── Init ─────────────────────────────────────────────────────

        async function getPublicIp() {
            try {
                const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
                const data = await res.json();
                return String(data.ip || '');
            } catch {
                return '';
            }
        }

        // ── Auto update ──────────────────────────────────────────────

        // an open tab keeps running old code after a deploy, so look for a newer version and reload into it
        // don't reload mid save, mid leave submission, or while someone is filling something in
        function updateBlocked() {
            if (saving) return true;
            if (document.getElementById('btn-submit-leave').disabled) return true;
            if (document.getElementById('tab-leave').classList.contains('active')) return true;
            return ['reason', 'leave-reason', 'leave-reason-text'].some(id => document.getElementById(id).value.trim());
        }

        const RELOAD_RETRY_MS = 10 * 60 * 1000; // GitHub Pages can take up to 10 min to serve a new deploy everywhere

        async function checkForUpdate() {
            if (updateBlocked()) return;
            try {
                const res = await fetch(`${location.pathname}?t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return;
                const m = (await res.text()).match(new RegExp("PAGE_VERSION = '([0-9.-]+)'"));
                if (!m || m[1] === PAGE_VERSION) return;
                if (updateBlocked()) return; // someone may have started something while the check was running
                // remember the last attempt so a stale copy can't cause a reload loop, but retry later in case it was the CDN
                let last = null;
                try {
                    last = JSON.parse(sessionStorage.getItem('alcovia_reload_attempt') || 'null');
                    sessionStorage.setItem('alcovia_reload_attempt', JSON.stringify({ v: m[1], at: last && last.v === m[1] && Date.now() - last.at < RELOAD_RETRY_MS ? last.at : Date.now() }));
                } catch {
                    return; // without storage there's no loop guard, so leave it to a manual refresh
                }
                if (last && last.v === m[1] && Date.now() - last.at < RELOAD_RETRY_MS) return;
                // a new query string skips the browser's cached copy of the old page
                location.replace(`${location.pathname}?v=${encodeURIComponent(m[1])}`);
            } catch {}
        }

        async function init() {
            isOnPremise = ALLOWED_IPS.includes(await getPublicIp());

            document.getElementById('app').classList.add('active');
            updateClock();
            setInterval(() => { updateClock(); updateUI(); }, 1000);
            setInterval(checkForUpdate, 5 * 60 * 1000);
            // phones pause timers in background tabs, so also check when the page comes back into view
            document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

            initTabs();
            setLeaveDefaults();

            document.querySelectorAll('#employee option[data-email]').forEach(opt => {
                prefetchYesterday({ email: opt.dataset.email });
            });

            document.getElementById('employee').addEventListener('change', () => {
                updateUI();
                const emp = getSelectedEmployee();
                if (emp) prefetchYesterday(emp);
            });
            document.getElementById('btn-checkin').addEventListener('click', () => record('in'));

            document.getElementById('leave-start').addEventListener('change', () => {
                const s = document.getElementById('leave-start').value;
                const e = document.getElementById('leave-end').value;
                if (e && e < s) document.getElementById('leave-end').value = s;
                updateLeaveDays();
            });
            document.getElementById('leave-end').addEventListener('change', updateLeaveDays);
            document.getElementById('btn-submit-leave').addEventListener('click', submitLeave);
        }

        init();
    </script>
</body>
</html>
